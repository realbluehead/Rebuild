name: Android (release APK)

# Triggered by a vX.Y.Z tag (created by `npm run release`): publishes the signed APK to Releases. Run by hand
# (workflow_dispatch), it builds the same APK and keeps it as the run's artifact (nothing is published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build && npx cap sync android
      # Without the signing key (secrets not set yet: tools/new-keystore.sh) a tag fails here, and a run by hand builds
      # a debug APK instead.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::No signing key (secret ANDROID_KEYSTORE_BASE64): run tools/new-keystore.sh and set the secrets." >&2
            exit 1
          else
            echo "::warning::No signing key: building a debug APK."
          fi
      - name: Build the APK (signed)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Build the APK (debug)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rebuild.apk
          gh release create "$GITHUB_REF_NAME" rebuild.apk --title "Rebuild ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Keep the APK (run by hand)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-apk
          path: android/app/build/outputs/apk/*/*.apk
          retention-days: 14
